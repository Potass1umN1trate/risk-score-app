name: Web App CI/CD Workflow

on:
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - 'k8s/web-app/**'
      - '.github/workflows/web-app.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: web-app
        run: npm ci

      - name: Run tests
        working-directory: web-app
        run: npm test

  # security-scan:
  #   uses: ./.github/workflows/security.yml

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # needs: security-scan
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/risk-score-web-app
          tags: |
            type=sha,prefix=sha-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web-app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}

  # trivy:
  #   name: Trivy Image Scan
  #   runs-on: ubuntu-latest
  #   needs: build
  #   steps:
  #     - name: Run Trivy
  #       uses: aquasecurity/trivy-action@master
  #       with:
  #         image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/risk-score-web-app:${{ needs.build.outputs.image_tag }}
  #         severity: CRITICAL
  #         exit-code: '1'

  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: build #[trivy, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tag
        run: |
          sed -i "s|image: .*risk-score-web-app.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/risk-score-web-app:${{ needs.build.outputs.image_tag }}|" k8s/web-app/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/web-app/deployment.yaml
          git commit -m "ci: update web-app image to ${{ needs.build.outputs.image_tag }}"
          git push
