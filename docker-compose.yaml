version: "3.9"

services:
  app:
    build: .
    container_name: risk-score-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: risk-score-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: riskdb
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
