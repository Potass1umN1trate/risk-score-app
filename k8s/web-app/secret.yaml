apiVersion: v1
kind: Secret
metadata:
  name: web-app-secret
  namespace: risk-score-app
type: Opaque
stringData:
  # Placeholder values for local/pre-deploy readiness only.
  # Replace all secret material before deploying to shared environments.
  DATABASE_URL: "postgresql://riskapp:riskapp_secret@postgres:5432/riskscoredb"
  AUTH_SECRET: "replace-with-dev-auth-secret-generated-by-openssl-rand-hex-32"
  GITHUB_CLIENT_ID: "replace-with-github-client-id"
  GITHUB_CLIENT_SECRET: "replace-with-github-client-secret"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "replace-with-dev-admin-password"
